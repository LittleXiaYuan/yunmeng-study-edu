server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Next.js static export: /admin → admin.html, /login → login.html, etc.
  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }

  location /_next/static/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|webmanifest)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
}
