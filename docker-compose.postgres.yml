services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-study}"
      POSTGRES_USER: "${POSTGRES_USER:-study}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-study123456}"
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-study} -d ${POSTGRES_DB:-study}"]
      interval: 10s
      timeout: 5s
      retries: 10

  edu-backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-18080}:18080"
    environment:
      EDU_ADDR: ":18080"
      EDU_DATA_DIR: "/app/data"
      EDU_ALLOWED_ORIGINS: "${EDU_ALLOWED_ORIGINS:-http://127.0.0.1:18081,http://localhost:18081}"
      YUNQUE_BASE_URL: "${YUNQUE_BASE_URL:-http://host.docker.internal:8080}"
      YUNQUE_API_KEY: "${YUNQUE_API_KEY:-}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-study}:${POSTGRES_PASSWORD:-study123456}@postgres:5432/${POSTGRES_DB:-study}?sslmode=disable"
      EDU_STORAGE_DRIVER: "${EDU_STORAGE_DRIVER:-json}"
    volumes:
      - edu-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./teacher-web-next
      args:
        NEXT_PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL:-http://127.0.0.1:18080}"
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-18081}:80"
    depends_on:
      edu-backend:
        condition: service_healthy

volumes:
  edu-data:
  postgres-data:
