services:
  edu-backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-18080}:18080"
    environment:
      EDU_ADDR: ":18080"
      EDU_DATA_DIR: "/app/data"
      EDU_STORAGE_DRIVER: "${EDU_STORAGE_DRIVER:-sqlite}"
      EDU_SQLITE_PATH: "${EDU_SQLITE_PATH:-/app/data/study.db}"
      EDU_ALLOWED_ORIGINS: "${EDU_ALLOWED_ORIGINS:-http://127.0.0.1:18081,http://localhost:18081}"
      YUNQUE_BASE_URL: "${YUNQUE_BASE_URL:-http://host.docker.internal:8080}"
      YUNQUE_API_KEY: "${YUNQUE_API_KEY:-}"
    volumes:
      - edu-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./teacher-web-next
      args:
        NEXT_PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL:-http://127.0.0.1:18080}"
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-18081}:80"
    depends_on:
      edu-backend:
        condition: service_healthy

volumes:
  edu-data:
